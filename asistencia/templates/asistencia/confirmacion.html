<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia Registrada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display:flex; align-items:center; }
        .card { border: none; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .success-icon { font-size: 80px; color: #22c55e; }
        .btn-outline-primary { border-color: #667eea; color: #667eea; }
        .btn-outline-primary:hover { background: #667eea; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card p-5">
                <div class="success-icon mb-3"><i class="bi bi-check-circle-fill"></i></div>
                <h2 class="fw-bold text-success">¡Asistencia Registrada!</h2>
                <p class="text-muted mt-2 mb-4">Tu registro de asistencia ha sido guardado exitosamente en el sistema.</p>
                <a href="/asistencia/" class="btn btn-outline-primary btn-lg">
                    <i class="bi bi-arrow-left me-2"></i>Nuevo Registro
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
